x-spark-runtime: &spark-runtime
  image: spark-training-runtime:3.5.7
  build:
    context: ./jupyter
    dockerfile: ${SPARK_DOCKERFILE:-Dockerfile.spark}

services:
  spark-master:
    <<: *spark-runtime
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["8080:8080"]
    networks: [sparknet]
    volumes:
      - ./jars/postgresql.jar:/opt/spark/jars/postgresql.jar:ro

  spark-worker-1:
    <<: *spark-runtime
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "2G", "--webui-port", "8081"]
    depends_on: [spark-master]
    ports: ["8081:8081"]
    volumes:
      - ./datasets:/home/spark/datasets
      - ./outputs:/home/spark/outputs
      - ./stream-input:/home/spark/stream-input:ro
      - ./jars/postgresql.jar:/opt/spark/jars/postgresql.jar:ro
    networks: [sparknet]

  spark-worker-2:
    <<: *spark-runtime
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "2G", "--webui-port", "8081"]
    depends_on: [spark-master]
    ports: ["8082:8081"]
    volumes:
      - ./datasets:/home/spark/datasets
      - ./outputs:/home/spark/outputs
      - ./stream-input:/home/spark/stream-input:ro
      - ./jars/postgresql.jar:/opt/spark/jars/postgresql.jar:ro
    networks: [sparknet]

  jupyter:
    build:
      context: ./jupyter
      dockerfile: ${JUPYTER_DOCKERFILE:-Dockerfile}
    environment:
      HOME: /home/spark
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      SPARK_HOME: /opt/spark
      SPARK_MASTER: spark://spark-master:7077
      JUPYTER_RUNTIME_DIR: /home/spark/.local/share/jupyter/runtime
      POSTGRES_HOST: postgres
      POSTGRES_DB: training
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/spark/notebooks
      - ./spark-app:/home/spark/spark-app
      - ./datasets:/home/spark/datasets
      - ./outputs:/home/spark/outputs
      - ./stream-input:/home/spark/stream-input
      # Jars
      - ./jars/postgresql.jar:/opt/spark/jars/postgresql.jar:ro
      
    depends_on:
      spark-master:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [sparknet]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: training
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [sparknet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d training"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["127.0.0.1:9092:9092"]
    networks: [sparknet]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - transactions
      - --partitions
      - "2"
      - --replication-factor
      - "1"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [sparknet]

volumes:
  postgres-data:
networks:
  sparknet:
    driver: bridge
