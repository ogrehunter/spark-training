services:
  # One-shot initializer for HDFS named-volume ownership and permissions.
  hdfs-init:
    image: alpine:3.20
    user: root
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        mkdir -p /namenode /datanode

        chown -R 1000:1000 /namenode /datanode
        chmod 700 /namenode /datanode

        echo "HDFS storage ownership initialized"
    volumes:
      - namenode-data:/namenode
      - datanode-data:/datanode
    networks: [sparknet]

  namenode:
    image: apache/hadoop:3.4.3
    hostname: namenode
    command: >
      bash -c "
      if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
        hdfs namenode -format -force;
      fi &&
      hdfs namenode
      "
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    ports:
      - "9870:9870"
    volumes:
      - namenode-data:/tmp/hadoop-root/dfs/name
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    networks: [sparknet]

  datanode:
    image: apache/hadoop:3.4.3
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
      namenode:
        condition: service_started
    ports:
      - "127.0.0.1:9864:9864"
    volumes:
      - datanode-data:/tmp/hadoop-root/dfs/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks: [sparknet]

  hive-metastore-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive-metastore-db:/var/lib/postgresql/data
    networks: [sparknet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10

  hive-metastore:
    image: apache/hive:4.1.0
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      namenode:
        condition: service_started
    networks: [sparknet]
    volumes:
      - ./jars/postgresql.jar:/opt/hive/lib/postgres.jar:ro
      - ./hadoop/core-site.xml:/hive_custom_conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/hive_custom_conf/hdfs-site.xml:ro 

  hiveserver2:
    image: apache/hive:4.1.0
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10002:10002"
    depends_on:
      - hive-metastore
      - namenode
    networks: [sparknet]
    volumes:
      - ./hadoop/core-site.xml:/hive_custom_conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/hive_custom_conf/hdfs-site.xml:ro

  spark-master:
    image: apache/spark:3.5.7
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["8080:8080"]
    networks: [sparknet]
    volumes:
      - ./hadoop/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./jars/postgresql.jar:/opt/spark/jars/postgresql.jar:ro

  spark-worker-1:
    image: apache/spark:3.5.7
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "2G", "--webui-port", "8081"]
    depends_on: [spark-master]
    ports: ["8081:8081"]
    volumes:
      - ./datasets:/home/spark/datasets:ro
      - ./outputs:/home/spark/outputs
      - ./hadoop/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./stream-input:/home/spark/stream-input:ro
      - ./jars/postgresql.jar:/opt/spark/jars/postgresql.jar:ro
    networks: [sparknet]

  spark-worker-2:
    image: apache/spark:3.5.7
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "2G", "--webui-port", "8081"]
    depends_on: [spark-master]
    ports: ["8082:8081"]
    volumes:
      - ./datasets:/home/spark/datasets:ro
      - ./outputs:/home/spark/outputs
      - ./hadoop/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./stream-input:/home/spark/stream-input:ro
      - ./jars/postgresql.jar:/opt/spark/jars/postgresql.jar:ro
    networks: [sparknet]

  jupyter:
    build:
      context: ./jupyter
      dockerfile: ${JUPYTER_DOCKERFILE:-Dockerfile}
    environment:
      HOME: /home/spark
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      SPARK_HOME: /opt/spark
      SPARK_MASTER: spark://spark-master:7077
      JUPYTER_RUNTIME_DIR: /home/spark/.local/share/jupyter/runtime
      POSTGRES_HOST: postgres
      POSTGRES_DB: training
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/spark/notebooks
      - ./spark-app:/home/spark/spark-app
      - ./datasets:/home/spark/datasets
      - ./outputs:/home/spark/outputs
      - ./stream-input:/home/spark/stream-input
      # Hadoop CLI
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      # Spark
      - ./hadoop/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      # Jars
      - ./jars/postgresql.jar:/opt/spark/jars/postgresql.jar:ro
      
    depends_on: [spark-master, postgres, kafka]
    networks: [sparknet]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: training
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [sparknet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d training"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["127.0.0.1:9092:9092"]
    networks: [sparknet]

volumes:
  postgres-data:
  namenode-data:
  datanode-data:
  hive-metastore-db:
networks:
  sparknet:
    driver: bridge
